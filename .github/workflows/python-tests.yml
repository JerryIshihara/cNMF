name: Python tests

on:
  # Includes direct pushes and merge commits pushed to the target branch.
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Read synthetic regression source
        id: synthetic-regression
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          spec = json.loads(
              Path("tests/fixtures/synthetic_cnmf_k3/run_spec.json").read_text()
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"repository={spec['upstream']['repository']}", file=output)
              print(f"commit={spec['upstream']['commit']}", file=output)
          PY

      - name: Check out pinned upstream cNMF
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.synthetic-regression.outputs.repository }}
          ref: ${{ steps.synthetic-regression.outputs.commit }}
          path: .upstream/dylkot-cnmf

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gpu,test]"

      - name: Run tests
        env:
          CNMF_UPSTREAM_SOURCE: ${{ github.workspace }}/.upstream/dylkot-cnmf
        run: bash run_tests.sh
